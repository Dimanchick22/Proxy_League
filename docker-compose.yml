services:
  postgres:
    image: postgres:15-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-proxyleague}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-proxyleague}
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_INTERNAL_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxyleague-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-proxyleague}-backend
    environment:
      DB_HOST: ${POSTGRES_HOST:-postgres}
      DB_PORT: ${POSTGRES_INTERNAL_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-proxyleague}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      SERVER_PORT: ${BACKEND_INTERNAL_PORT:-8080}
      GIN_MODE: ${GIN_MODE:-debug}
      HOYOLAB_LTOKEN_V2: ${HOYOLAB_LTOKEN_V2}
      HOYOLAB_LTUID_V2: ${HOYOLAB_LTUID_V2}
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_INTERNAL_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxyleague-network
    restart: ${RESTART_POLICY:-unless-stopped}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080/api/v1}
    container_name: ${COMPOSE_PROJECT_NAME:-proxyleague}-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_INTERNAL_PORT:-80}"
    depends_on:
      - backend
    networks:
      - proxyleague-network
    restart: ${RESTART_POLICY:-unless-stopped}

volumes:
  postgres_data:

networks:
  proxyleague-network:
    driver: bridge
